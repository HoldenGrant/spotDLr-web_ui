<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>spotDLr</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%231ed760'/%3E%3Cpath d='M11 6h2v6.6l2.3-2.3 1.4 1.4L12 16.4l-4.7-4.7 1.4-1.4 2.3 2.3z' fill='%23000'/%3E%3C/svg%3E">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="spotDLr">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="topbar-left">
                <a class="brand" href="#/" aria-label="spotDLr home">
                    <span class="brand-mark" id="brandMark"></span>
                    <span class="brand-name">spotDLr</span>
                </a>
                <div class="nav-arrows">
                    <button class="icon-btn filled" id="navBack" aria-label="Go back"></button>
                    <button class="icon-btn filled" id="navForward" aria-label="Go forward"></button>
                </div>
            </div>
            <div class="topbar-center">
                <a class="icon-btn big home-btn" id="homeBtn" href="#/" aria-label="Home"></a>
                <label class="search-box" id="searchBox">
                    <span id="searchIcon"></span>
                    <span class="sr-only">Search</span>
                    <input id="searchInput" type="search" placeholder="What do you want to play?" autocomplete="off" spellcheck="false">
                    <button class="icon-btn clear" id="searchClear" type="button" aria-label="Clear search"></button>
                </label>
            </div>
            <div class="topbar-right">
                <a class="icon-btn big" id="statsBtn" href="#/stats" aria-label="Your stats" title="Your stats"></a>
                <a class="icon-btn big" id="downloadsBtn" href="#/downloads" aria-label="Downloads">
                    <span class="badge" id="downloadsBadge" hidden>0</span>
                </a>
                <button class="icon-btn big" id="settingsBtn" aria-label="Settings" title="Settings"></button>
            </div>
        </header>

        <aside class="sidebar panel" id="librarySidebar" aria-label="Your Library">
            <div class="sidebar-head">
                <a class="sidebar-title" href="#/songs" id="libraryTitle" aria-label="Your Library" title="Your Library"></a>
                <button class="icon-btn" id="sidebarToggle" aria-label="Collapse sidebar" aria-expanded="true" aria-controls="librarySidebar" title="Collapse sidebar"></button>
                <button class="icon-btn" id="createBtn" aria-label="Create playlist or add music files" aria-haspopup="menu" title="Create"></button>
            </div>
            <div class="chips" id="libraryChips" role="group" aria-label="Filter library"></div>
            <div class="lib-tools">
                <label class="lib-filter" id="libraryFilter">
                    <span class="sr-only">Search in Your Library</span>
                    <input id="libraryFilterInput" type="search" placeholder="Search in Your Library" autocomplete="off">
                </label>
                <button class="lib-sort" id="librarySort" aria-haspopup="menu"></button>
            </div>
            <ul class="lib-list" id="libraryList"></ul>
        </aside>

        <main class="main panel" id="main">
            <div class="view" id="view"></div>
        </main>

        <footer class="player idle" id="player" aria-label="Now playing">
            <div class="now-playing">
                <div class="art" id="npArt"></div>
                <div class="np-text">
                    <a class="np-title" id="npTitle" href="#/"></a>
                    <div class="np-artist" id="npArtist"></div>
                </div>
                <span id="npLike"></span>
            </div>
            <div class="controls">
                <div class="control-buttons">
                    <button class="toggle-btn" id="shuffleBtn" aria-label="Shuffle" aria-pressed="false"></button>
                    <button class="icon-btn skip-back" id="prevBtn" aria-label="Previous"></button>
                    <button class="play-btn" id="playBtn" aria-label="Play"></button>
                    <button class="icon-btn" id="nextBtn" aria-label="Next"></button>
                    <button class="toggle-btn" id="repeatBtn" aria-label="Repeat" aria-pressed="false"></button>
                </div>
                <div class="seek-row">
                    <span id="timeCurrent">0:00</span>
                    <input class="bar" id="seekBar" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
                    <span id="timeTotal">0:00</span>
                </div>
            </div>
            <div class="extras">
                <button class="icon-btn" id="queueBtn" aria-label="Queue" aria-pressed="false" title="Queue (Q)"></button>
                <button class="icon-btn" id="nowBtn" aria-label="Now playing view" aria-pressed="false"></button>
                <button class="icon-btn vol" id="muteBtn" aria-label="Mute"></button>
                <input class="bar volume" id="volumeBar" type="range" min="0" max="100" value="80" aria-label="Volume">
            </div>
        </footer>

        <nav class="tabbar" id="tabbar" aria-label="Main">
            <a href="#/" data-tab="home"><span class="tab-icon" data-icon="home"></span><span>Home</span></a>
            <a href="#/search" data-tab="search"><span class="tab-icon" data-icon="search"></span><span>Search</span></a>
            <a href="#/library" data-tab="library"><span class="tab-icon" data-icon="library"></span><span>Your Library</span></a>
        </nav>
    </div>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <div id="nowRoot"></div>
    <div id="queueRoot"></div>
    <div id="modalRoot"></div>
    <div id="menuRoot"></div>
    <div class="drop-overlay" id="dropOverlay" hidden><div>Drop music files to add them to spotDLr</div></div>

    <script src="/static/app.js"></script>
</body>
</html>
