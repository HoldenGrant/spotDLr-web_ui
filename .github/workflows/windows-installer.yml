# Builds spotDLr-Setup.exe on a real Windows machine, installs it and smoke-tests it like a user would.
# Every push: build + test + downloadable artifact (Actions tab).
# Version tag (git tag v2.0.0 && git push origin v2.0.0): also publishes a public GitHub Release,
# whose text is that version's CHANGELOG.md section followed by installer/RELEASE_NOTES.md.
name: Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to publish the release on version tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python installer/update_ytdlp.py

      - name: Download ffmpeg and Node.js to bundle
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          New-Item -ItemType Directory -Force installer/bin | Out-Null
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg-unzipped
          Copy-Item (Get-ChildItem ffmpeg-unzipped -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName installer/bin/
          Invoke-WebRequest https://nodejs.org/dist/v22.12.0/node-v22.12.0-win-x64.zip -OutFile node.zip
          Expand-Archive node.zip node-unzipped
          Copy-Item (Get-ChildItem node-unzipped -Recurse -Filter node.exe | Select-Object -First 1).FullName installer/bin/
          Get-ChildItem installer/bin | Format-Table Name, Length

      - name: Check the tag matches version.py (version tags only)
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $code = python -c "import version; print(version.VERSION)"
          if ("v$code" -ne "${{ github.ref_name }}") {
            Write-Output "::error::Tag ${{ github.ref_name }} but version.py says $code. Set VERSION in version.py (and CHANGELOG.md), commit, and tag again."
            exit 1
          }

      - name: Build the app (PyInstaller)
        run: pyinstaller installer/spotDLr.spec --noconfirm --distpath dist --workpath build

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-dev.${{ github.run_number }}" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$version" installer/spotDLr.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist-installer/spotDLr-Setup.exe | Format-Table Name, Length

      - name: Smoke test - install and run it like a user would
        shell: pwsh
        run: |
          Start-Process dist-installer/spotDLr-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $installed = "$env:LOCALAPPDATA\Programs\spotDLr"
          if (-not (Test-Path "$installed\spotDLr.exe")) { throw "spotDLr.exe not installed at $installed" }
          foreach ($tool in "ffmpeg.exe", "node.exe") {
            if (-not (Test-Path "$installed\_internal\bin\$tool")) { throw "$tool missing from the install" }
          }
          & "$installed\_internal\bin\node.exe" --version

          $env:SPOTDLR_NO_BROWSER = "1"   # serve only: there's no screen on the build machine
          $app = Start-Process "$installed\spotDLr.exe" -PassThru
          $base = "http://127.0.0.1:8000"
          $up = $false
          for ($i = 0; $i -lt 120; $i++) {
            try { if ((Invoke-RestMethod "$base/api/status/init" -TimeoutSec 2).search_source) { $up = $true; break } } catch { }
            Start-Sleep 1
          }
          Write-Output "--- spotDLr.log"; Get-Content "$env:LOCALAPPDATA\spotDLr\spotDLr.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
          if (-not $up) { throw "spotDLr did not start" }

          if ((Invoke-WebRequest "$base/" -UseBasicParsing).StatusCode -ne 200) { throw "page not served" }
          if ((Invoke-WebRequest "$base/static/app.js" -UseBasicParsing).StatusCode -ne 200) { throw "app.js not served" }
          $library = Invoke-RestMethod "$base/api/library"
          Write-Output "library: $($library.tracks.Count) tracks"

          # YouTube can block cloud machines, so these warn instead of failing the build
          try {
            $search = Invoke-RestMethod "$base/api/search?q=jvke%20golden%20hour"
            Write-Output "search: $($search.tracks.Count) tracks ($($search.source))"
          } catch { Write-Output "::warning::YouTube Music search failed on the build machine: $_" }
          try {
            $body = '{"query": "https://music.youtube.com/watch?v=uV_5eEvamoQ"}'
            Invoke-RestMethod "$base/api/download" -Method Post -Body $body -ContentType "application/json" | Out-Null
            for ($i = 0; $i -lt 60; $i++) {
              $job = (Invoke-RestMethod "$base/api/jobs").jobs[0]
              if ($job.status -notin "queued", "downloading") { break }
              Start-Sleep 2
            }
            Write-Output "download: $($job.status) - $($job.message) $($job.error)"
            if ($job.status -ne "completed") { Write-Output "::warning::Test download didn't complete on the build machine: $($job.error)" }
            Get-ChildItem "$env:USERPROFILE\Music\spotDLr" -Recurse -File -ErrorAction SilentlyContinue | Format-Table Name, Length
          } catch { Write-Output "::warning::Test download errored on the build machine: $_" }
          try {
            $song = (Invoke-RestMethod "$base/api/library").tracks | Select-Object -First 1
            if ($song) {
              $lyrics = Invoke-RestMethod "$base/api/lyrics/$($song.id)"
              Write-Output "lyrics for $($song.title): $(if ($lyrics.lines) { "$($lyrics.lines.Count) synced lines" } elseif ($lyrics.plain) { 'plain' } else { 'none' }) ($($lyrics.source))"
            }
          } catch { Write-Output "::warning::Lyrics lookup failed on the build machine: $_" }
          Stop-Process -Id $app.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: spotDLr-Setup
          path: dist-installer/spotDLr-Setup.exe

      - name: Publish the release (version tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python installer/release_notes.py "${{ github.ref_name }}" --out release-notes.md
          gh release create "${{ github.ref_name }}" dist-installer/spotDLr-Setup.exe --title "spotDLr ${{ github.ref_name }}" --notes-file release-notes.md
